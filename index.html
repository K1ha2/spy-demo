<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007bff">
  <title id="title">Spy Game</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="icon" href="icon-512.png" sizes="512x512">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header with settings button -->
  <header>
    <h1 id="title">Spy Game</h1>
    <button id="settingsToggle" aria-label="Einstellungen" class="settings-button">⚙️</button>
  </header>

  <!-- Settings Panel -->
  <div id="settings" class="hidden settings-panel">
    <h2 data-i18n="language">Sprache</h2>
    <select id="languageSelect">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
    </select>

    <label for="rounds" data-i18n="rounds">Runden</label>
    <input type="number" id="rounds" value="5" min="1">

    <button onclick="resetScore()" data-i18n="reset_score">Punktestand zurücksetzen</button>
    <button onclick="installPWA()" data-i18n="download_app">App herunterladen</button>
  </div>

  <!-- Setup Section -->
  <section id="setup">
    <h2 data-i18n="player_count">Anzahl der Spieler</h2>
    <input type="number" id="playerCount" value="4" min="2">
    <button onclick="startGame()" data-i18n="start_game">Spiel starten</button>
  </section>

  <!-- Roles Section -->
  <section id="roles" class="hidden">
    <h2 data-i18n="discussion">Diskussion: Wer ist der Spion?</h2>
  </section>

  <!-- Voting Section -->
  <section id="voting" class="hidden"></section>

  <!-- Result Section -->
  <section id="result" class="hidden"></section>

  <!-- Footer with score display -->
  <footer>
    <p id="scoreDisplay" data-i18n="score">Punktestand: 0</p>
  </footer>

  <script src="app.js"></script>
  <script>
    // PWA-Install-Logik
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(registration => {
            console.log('Service Worker registriert mit Scope:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker Registrierung fehlgeschlagen:', error);
          });
      });
    }
  </script>
</body>
</html>
